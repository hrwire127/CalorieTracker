workflows:
  ios-simulator-screenshots:
    name: iOS Simulator Screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
        BUNDLE_ID: "com.artiom.calorietracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build app for screenshot simulator
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/ScreenshotDerivedData"
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/screenshot-simulator-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed" /tmp/xcodebuild_logs/screenshot-simulator-build.log | tail -120 || true
            exit $BUILD_STATUS
          fi
      - name: Boot simulator and capture screenshots
        script: |
          SCREENSHOT_DIR="$CM_BUILD_DIR/build/screenshots"
          mkdir -p "$SCREENSHOT_DIR"

          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15|14)" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "Could not find or create an iPhone simulator."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator id: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH=$(find "$CM_BUILD_DIR/build/ScreenshotDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built simulator .app."
            find "$CM_BUILD_DIR/build/ScreenshotDerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_DIR/dashboard.png"

          echo "Created screenshots:"
          ls -la "$SCREENSHOT_DIR"
    artifacts:
      - build/screenshots/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build app for iOS Simulator
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/simulator-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed" /tmp/xcodebuild_logs/simulator-build.log | tail -100 || true
            exit $BUILD_STATUS
          fi
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-unsigned-device-ipa:
    name: iOS Unsigned Device IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build unsigned app for physical iPhone
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/DerivedData"
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/unsigned-device-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed|Signing|Provisioning" /tmp/xcodebuild_logs/unsigned-device-build.log | tail -100 || true
            exit $BUILD_STATUS
          fi
      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app in Release-iphoneos."
            find "$CM_BUILD_DIR/build/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          IPA_DIR="$CM_BUILD_DIR/build/ios/unsigned"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          rm -rf "$PAYLOAD_DIR"/*.app
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"
          zip -qry CalorieTracker-unsigned.ipa Payload
          echo "Created $IPA_DIR/CalorieTracker-unsigned.ipa"
    artifacts:
      - build/ios/unsigned/*.ipa
      - build/ios/unsigned/Payload/*.app
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.artiom.calorietracker"
      vars:
        BUNDLE_ID: "com.artiom.calorietracker"
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
        APP_STORE_APPLE_ID: "0000000000"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          if [ "$APP_STORE_APPLE_ID" = "0000000000" ]; then
            echo "Replace APP_STORE_APPLE_ID with the Apple ID from App Store Connect > App Information."
            exit 1
          fi
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build IPA for distribution
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" 2>&1 | tee /tmp/xcodebuild_logs/ipa-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed" /tmp/xcodebuild_logs/ipa-build.log | tail -100 || true
            exit $BUILD_STATUS
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - "your-email@example.com"
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
