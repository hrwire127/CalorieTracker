workflows:
  ios-simulator-screenshots:
    name: iOS Simulator Screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
        XCODE_SCREENSHOT_SCHEME: "CalorieTrackerScreenshots"
        BUNDLE_ID: "com.artiom.calorietracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build app for screenshot simulator
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/ScreenshotDerivedData"
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/screenshot-simulator-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed" /tmp/xcodebuild_logs/screenshot-simulator-build.log | tail -120 || true
            exit $BUILD_STATUS
          fi
      - name: Run screenshot UI tests
        script: |
          SCREENSHOT_DIR="$CM_BUILD_DIR/build/screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          mkdir -p /tmp/xcodebuild_logs

          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15|14)" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "Could not find or create an iPhone simulator."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator id: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light || true

          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/ScreenshotDerivedData"
          RESULT_BUNDLE_PATH="$CM_BUILD_DIR/build/ScreenshotTests.xcresult"
          rm -rf "$RESULT_BUNDLE_PATH"

          set +e
          SCREENSHOT_DIR="$SCREENSHOT_DIR" xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCREENSHOT_SCHEME" \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/screenshot-ui-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          if [ $TEST_STATUS -ne 0 ]; then
            echo "---- Relevant screenshot test errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed|XCTAssert|XCTFail" /tmp/xcodebuild_logs/screenshot-ui-tests.log | tail -140 || true
            exit $TEST_STATUS
          fi

          ATTACHMENT_DIR="$SCREENSHOT_DIR/xcresult-attachments"
          mkdir -p "$ATTACHMENT_DIR"

          if xcrun xcresulttool export attachments \
            --path "$RESULT_BUNDLE_PATH" \
            --output-path "$ATTACHMENT_DIR" >/tmp/xcodebuild_logs/xcresult-attachments-export.log 2>&1; then
            find "$ATTACHMENT_DIR" -type f -name "*.png" -exec cp {} "$SCREENSHOT_DIR/" \;
          else
            echo "xcresulttool attachment export failed; falling back to direct PNG extraction."
            cat /tmp/xcodebuild_logs/xcresult-attachments-export.log || true
          fi

          PNG_COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -name "*.png" | wc -l | tr -d ' ')
          if [ "$PNG_COUNT" -eq 0 ]; then
            SCREENSHOT_NAMES=(
              "01_dashboard"
              "02_diet_goal"
              "03_manual_entry"
              "04_ai_entry"
              "05_history"
              "06_stats"
              "07_about_me"
            )
            PNG_INDEX=0

            while IFS= read -r png_file; do
              if [ "$PNG_INDEX" -lt "${#SCREENSHOT_NAMES[@]}" ]; then
                target_name="${SCREENSHOT_NAMES[$PNG_INDEX]}"
              else
                target_name=$(printf "screenshot_%02d" "$((PNG_INDEX + 1))")
              fi

              cp "$png_file" "$SCREENSHOT_DIR/$target_name.png"
              PNG_INDEX=$((PNG_INDEX + 1))
            done < <(
              find "$RESULT_BUNDLE_PATH/Data" -type f -name "data*" -print0 |
              while IFS= read -r -d '' data_file; do
                if [ "$(xxd -p -l 8 "$data_file")" = "89504e470d0a1a0a" ]; then
                  stat -f "%m %N" "$data_file"
                fi
              done |
              sort -n |
              cut -d ' ' -f 2-
            )
          fi

          PNG_COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -name "*.png" | wc -l | tr -d ' ')
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "No PNG screenshots were extracted."
            find "$RESULT_BUNDLE_PATH" -maxdepth 3 -type f | head -120 || true
            exit 1
          fi

          echo "Created screenshots:"
          ls -la "$SCREENSHOT_DIR"
    artifacts:
      - build/screenshots/*.png
      - build/screenshots/**/*.png
      - build/ScreenshotTests.xcresult/**
      - /tmp/xcodebuild_logs/*.log

  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build app for iOS Simulator
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/simulator-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed" /tmp/xcodebuild_logs/simulator-build.log | tail -100 || true
            exit $BUILD_STATUS
          fi
      - name: Run unit tests
        script: |
          mkdir -p /tmp/xcodebuild_logs
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (16|15|14)" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "Could not find an available iPhone simulator."
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/TestDerivedData"
          RESULT_BUNDLE_PATH="$CM_BUILD_DIR/build/UnitTests.xcresult"
          rm -rf "$RESULT_BUNDLE_PATH"

          set +e
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -only-testing:CalorieTrackerTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/unit-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          if [ $TEST_STATUS -ne 0 ]; then
            echo "---- Relevant unit test errors ----"
            grep -nE "error:|fatal error:|failed|XCTAssert|XCTFail|Test Case.*failed" /tmp/xcodebuild_logs/unit-tests.log | tail -140 || true
            exit $TEST_STATUS
          fi
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - build/UnitTests.xcresult/**
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-unsigned-device-ipa:
    name: iOS Unsigned Device IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "CalorieTracker.xcodeproj"
        XCODE_SCHEME: "CalorieTracker"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
      - name: Build unsigned app for physical iPhone
        script: |
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -version
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build/DerivedData"
          set +e
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild_logs/unsigned-device-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "---- Relevant build errors ----"
            grep -nE "error:|fatal error:|No such module|cannot find|failed|Signing|Provisioning" /tmp/xcodebuild_logs/unsigned-device-build.log | tail -100 || true
            exit $BUILD_STATUS
          fi
      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app in Release-iphoneos."
            find "$CM_BUILD_DIR/build/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          IPA_DIR="$CM_BUILD_DIR/build/ios/unsigned"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          rm -rf "$PAYLOAD_DIR"/*.app
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"
          zip -qry CalorieTracker-unsigned.ipa Payload
          echo "Created $IPA_DIR/CalorieTracker-unsigned.ipa"
    artifacts:
      - build/ios/unsigned/*.ipa
      - build/ios/unsigned/Payload/*.app
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
