name: CalorieTracker
options:
  bundleIdPrefix: com.artiom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
targets:
  CalorieTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalorieTrackerApp.swift
      - path: Configuration
      - path: Models
      - path: Services
      - path: Utilities
      - path: ViewModels
      - path: Views
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artiom.calorietracker
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
  CalorieTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: CalorieTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artiom.calorietracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CalorieTracker
schemes:
  CalorieTrackerScreenshots:
    build:
      targets:
        CalorieTracker: all
        CalorieTrackerUITests: [test]
    test:
      targets:
        - CalorieTrackerUITests
